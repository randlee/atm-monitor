name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and Git integration tests (no live ATM, Herdr, or GitHub access)
        run: python -m unittest discover -s skills/atm-oversight/tests -v
      - name: Compile scripts
        run: python -m compileall -q skills/atm-oversight/scripts skills/atm-oversight/tests scripts
      - name: Distribution and isolated bundle tests
        run: python -m unittest discover -s tests -v
