[atm]
default_team = "atm-monitor"

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "atm-monitor"

[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
alias = "mon-lead"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "atm-monitor" }

[[rmux.windows.panes]]
name = "amon"
command = "codex --no-daemon -c features.codex_hooks=true --yolo --model gpt-6-astra"
env = { ATM_IDENTITY = "amon", ATM_TEAM = "atm-monitor" }

[[rmux.windows.panes]]
name = "quality-mgr"
alias = "mon-quality-mgr"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "atm-monitor" }
